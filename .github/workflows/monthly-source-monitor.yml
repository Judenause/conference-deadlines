name: monthly-source-monitor

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun packages/crawler/src/cli.ts monitor
      - run: bunx biome format --write data/seed/catalog-state.json
      - id: change
        run: |
          if test -z "$(git status --porcelain -- data/monitor data/seed/catalog-state.json)"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.change.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/monthly-source-monitor
          delete-branch: true
          commit-message: "chore(crawler): record monthly source review"
          title: "Monthly official-source review"
          body: |
            This automated review records source health, redirects, content fingerprints, and stale future-edition schedule findings.
            It also proposes unambiguous deadline changes extracted from official pages, with source evidence in the catalog.
            Review every proposed date and merge only when the official page confirms it. Merging triggers the GitHub Pages deployment.
