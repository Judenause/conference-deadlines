name: weekly-source-monitor

on:
  schedule:
    # Monday 03:00 KST. The daily imminent-deadline monitor runs at 09:00 KST.
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Detect management server request sync configuration
        id: management-config
        env:
          MANAGEMENT_API_URL: ${{ vars.MANAGEMENT_API_URL }}
          MANAGEMENT_SYNC_TOKEN: ${{ secrets.MANAGEMENT_SYNC_TOKEN }}
        run: |
          if test -n "$MANAGEMENT_API_URL" && test -n "$MANAGEMENT_SYNC_TOKEN"; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync approved conference requests from management server
        if: steps.management-config.outputs.configured == 'true'
        run: bun packages/crawler/src/cli.ts sync-requests
        env:
          MANAGEMENT_API_URL: ${{ vars.MANAGEMENT_API_URL }}
          MANAGEMENT_SYNC_TOKEN: ${{ secrets.MANAGEMENT_SYNC_TOKEN }}
      - name: Warn when management request sync is not configured
        if: steps.management-config.outputs.configured != 'true'
        run: echo "::warning::MANAGEMENT_API_URL or MANAGEMENT_SYNC_TOKEN is not configured; skipping conference request sync."
      - run: bun packages/crawler/src/cli.ts monitor
      - run: bunx biome format --write data/seed/catalog-state.json
      - id: change
        run: |
          if test -z "$(git status --porcelain -- data/monitor data/seed/catalog-state.json)"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.change.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/weekly-source-monitor
          delete-branch: true
          commit-message: "chore(crawler): record weekly source review"
          title: "Weekly official-source review"
          body: |
            This automated review records source health, redirects, content fingerprints, and stale future-edition schedule findings for the full catalogue.
            It also proposes unambiguous deadline changes extracted from official pages, with source evidence in the catalog.
            Review every proposed date and merge only when the official page confirms it. Merging triggers the GitHub Pages deployment.
