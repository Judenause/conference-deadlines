name: weekly-source-monitor

on:
  schedule:
    # Monday 03:00 KST. The daily imminent-deadline monitor runs at 09:00 KST.
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Detect Firebase request sync configuration
        id: firebase-config
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate Firebase request sync
        if: steps.firebase-config.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Set up Google Cloud SDK
        if: steps.firebase-config.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      - name: Mint Firebase access token
        if: steps.firebase-config.outputs.configured == 'true'
        id: firebase-token
        run: echo "access_token=$(gcloud auth print-access-token)" >> "$GITHUB_OUTPUT"
      - name: Sync submitted conference requests
        if: steps.firebase-config.outputs.configured == 'true'
        run: bun packages/crawler/src/cli.ts sync-requests
        env:
          FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_ACCESS_TOKEN: ${{ steps.firebase-token.outputs.access_token }}
      - name: Warn when Firebase request sync is not configured
        if: steps.firebase-config.outputs.configured != 'true'
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON is not configured; skipping conference request sync."
      - run: bun packages/crawler/src/cli.ts monitor
      - run: bunx biome format --write data/seed/catalog-state.json
      - id: change
        run: |
          if test -z "$(git status --porcelain -- data/monitor data/seed/catalog-state.json)"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.change.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/weekly-source-monitor
          delete-branch: true
          commit-message: "chore(crawler): record weekly source review"
          title: "Weekly official-source review"
          body: |
            This automated review records source health, redirects, content fingerprints, and stale future-edition schedule findings for the full catalogue.
            It also proposes unambiguous deadline changes extracted from official pages, with source evidence in the catalog.
            Review every proposed date and merge only when the official page confirms it. Merging triggers the GitHub Pages deployment.
