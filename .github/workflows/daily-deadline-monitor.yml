name: daily-imminent-deadline-monitor

on:
  schedule:
    # 09:00 KST. Only sources with a submission deadline in the next 30 days.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-imminent-deadline-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - id: monitor
        run: |
          result="$(bun packages/crawler/src/cli.ts monitor --deadline-within-days 30)"
          echo "$result"
          if test -n "$(git status --porcelain -- data/monitor data/seed/catalog-state.json)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "auto_merge_eligible=$(echo "$result" | jq -r '.autoMergeEligible')" >> "$GITHUB_OUTPUT"
      - id: create-pr
        if: steps.monitor.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/daily-imminent-deadline-monitor
          delete-branch: true
          commit-message: "chore(crawler): record imminent deadline review"
          title: "Daily imminent-deadline review"
          body: |
            This daily review checks only official sources with a submission deadline in the next 30 days.
            URL moves, availability changes, ambiguous timezones, and ordinary content changes require human review.

            Auto-merge eligibility: ${{ steps.monitor.outputs.auto_merge_eligible }}
      # Pull requests made with the repository token do not trigger a second
      # pull_request workflow. Verify and merge the strictly eligible update
      # here so the workflow is both reliable and auditable.
      - if: >-
          steps.monitor.outputs.auto_merge_eligible == 'true' &&
          steps.create-pr.outputs.pull-request-url != ''
        run: bun run typecheck
      - if: >-
          steps.monitor.outputs.auto_merge_eligible == 'true' &&
          steps.create-pr.outputs.pull-request-url != ''
        run: bun run lint
      - if: >-
          steps.monitor.outputs.auto_merge_eligible == 'true' &&
          steps.create-pr.outputs.pull-request-url != ''
        run: bun run test
      - if: >-
          steps.monitor.outputs.auto_merge_eligible == 'true' &&
          steps.create-pr.outputs.pull-request-url != ''
        run: bun run build:pages
      - name: Squash merge a verified deadline update
        if: >-
          steps.monitor.outputs.auto_merge_eligible == 'true' &&
          steps.create-pr.outputs.pull-request-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: gh pr merge --squash --delete-branch "$PR_URL"
